// Agent <-> control-plane contract. One bidi Session stream per host: uplink
// carries what the agent OBSERVES (heartbeats, replica states, disk sizes),
// downlink carries what the host SHOULD look like — always the full host
// state (replicas and volumes), never a delta, so any single message is sufficient and a lost one is healed by the
// next (level-triggered; see todo.md "agent transport").
syntax = "proto3";

package conductor.agent.v1;

option go_package = "conductor/proto/agentpb";

service AgentAPI {
  // Session is the agent's whole protocol. First uplink message must be Hello;
  // after it the server pushes HostState on every relevant change plus a
  // periodic resync, and ingests heartbeats/observations through the Sensor.
  // The stream being open is NOT liveness — only heartbeats are (the sensor
  // sweep works off their server-side timestamps).
  rpc Session(stream AgentMessage) returns (stream ServerMessage);

  // ListHosts exposes the schedulable fleet so the agent simulator can spawn
  // one agent per host without its own database connection.
  rpc ListHosts(ListHostsRequest) returns (ListHostsResponse);
}

message AgentMessage {
  oneof msg {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    ReplicaObservation observation = 3;
    VolumeObservation volume_observation = 4;
  }
}

// Hello binds the stream to a host. Exactly one, first.
message Hello {
  string host_id = 1;
}

// Heartbeat is the liveness ping; the server stamps its own observation time
// (an agent's skewed clock must not keep a dead host alive). It carries no
// payload: the beat itself is the host's health, and scheduling status is
// operator intent the agent has no say in.
message Heartbeat {
  reserved 1; // was `status` — the server never let it override anything
}

// ReplicaObservation mirrors storage.ReplicaObservation.
message ReplicaObservation {
  string replica_id = 1;
  string phase = 2;
  bool healthy = 3;
  int32 restart_count = 4;
  string last_exit_reason = 5;
}

// VolumeObservation is what the agent has on disk for one volume. The control
// plane compares it against the desired size to notice resize drift and to
// settle a resize once the disk has caught up.
message VolumeObservation {
  string volume_id = 1;
  int64 observed_size_bytes = 2;
}

message ServerMessage {
  HostState state = 1;
}

// HostState is the FULL set of replicas and volumes bound to the host. A
// replica present in phase scheduling is the signal to start it; draining to
// stop it; absent means gone (reaped or moved) — the agent removes anything it
// runs that the state no longer lists. A volume present is a disk to have at
// size_bytes: create it on first sight, grow it when the size exceeds what's
// on disk (never shrink), delete it when absent.
message HostState {
  repeated Replica replicas = 1;
  repeated Volume volumes = 2;
}

message Replica {
  string id = 1;
  string phase = 2;
}

// Volume is the size the agent should converge the disk to — NOT the raw
// desired size. The control plane hands out the new desired size only once
// the engine has approved the grow against host capacity; until then the
// agent keeps seeing what it already has.
message Volume {
  string id = 1;
  string mount_path = 2;
  int64 size_bytes = 3;
}

message ListHostsRequest {}

message ListHostsResponse {
  repeated Host hosts = 1;
}

message Host {
  string id = 1;
  string region = 2;
  string hostname = 3;
}
