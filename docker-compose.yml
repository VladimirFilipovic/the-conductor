services:
  postgres:
    image: postgres:17-alpine
    container_name: conductor-postgres
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
      POSTGRES_DB: conductor
    ports:
      - "5432:5432"
    volumes:
      - conductor-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor -d conductor"]
      interval: 5s
      timeout: 5s
      retries: 5

  engine:
    # Profiled so the plain `docker compose up` (make db-up / migrate-fresh)
    # starts only Postgres — the inner-loop workflow runs the engine from source
    # with `go run`, against that container. The full stack, this service
    # included, comes up via `make stack-up`.
    profiles: ["stack"]
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: conductor-engine
    environment:
      CONDUCTOR_DATABASE_URL: postgres://conductor:conductor@postgres:5432/conductor?sslmode=disable
      CONDUCTOR_LOGS_ADDR: ":7090"
      LOG_LEVEL: DEBUG
    ports:
      # Log stream (SSE). chaos-ui reaches it over the compose network; the
      # published port is for `curl -N localhost:7090/logs/stream`.
      - "7090:7090"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  apiserver:
    profiles: ["stack"]
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: conductor-apiserver
    # Same image as the engine, different entrypoint script: this one migrates
    # nothing and waits for the engine to have seeded the fleet.
    command: ["/usr/local/bin/apiserver-entrypoint.sh"]
    environment:
      CONDUCTOR_DATABASE_URL: postgres://conductor:conductor@postgres:5432/conductor?sslmode=disable
      LOG_LEVEL: DEBUG
    ports:
      # AgentAPI gRPC (agents dial in) and OperatorAPI HTTP.
      - "7443:7443"
      - "7080:7080"
    depends_on:
      - engine
    restart: unless-stopped

  agentsim:
    profiles: ["stack"]
    build:
      context: .
      dockerfile: Dockerfile.agentsim
    container_name: conductor-agentsim
    environment:
      CONDUCTOR_AGENTAPI_ADDR: apiserver:7443
    ports:
      # Chaos control API — chaos-ui (and curl) hit it.
      - "7780:7780"
    depends_on:
      - apiserver
    restart: unless-stopped

  chaos-ui:
    profiles: ["stack"]
    build:
      context: ./chaos-ui
      dockerfile: Dockerfile
    container_name: conductor-chaos-ui
    environment:
      AGENTSIM_URL: http://agentsim:7780
      CONTROL_PLANE_URL: http://apiserver:7080
      ENGINE_LOG_URL: http://engine:7090
    ports:
      # Override when 3000 is taken locally: CHAOS_UI_PORT=3001 make stack-up
      - "${CHAOS_UI_PORT:-3000}:3000"
    # No database link: every read and write goes through the apiserver, and
    # the engine log arrives over HTTP rather than a shared volume.
    depends_on:
      - apiserver
    restart: unless-stopped

volumes:
  conductor-pgdata:
